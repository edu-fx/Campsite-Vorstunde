<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How can we plan a day at a campsite?</title>
<meta name="theme-color" content="#F3F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lake Camp">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#DEDBD6; --surface:#F3F2EF; --card:#FFFFFF; --ink:#1B1B1E; --ink2:#46464C; --muted:#86868D; --line:#E2DFDA;
  --accent:#FFC93C; --accent-ink:#2B2100;
  --M:#E5484D; --Msoft:#FDECEC; --R:#1F7A7A; --Rsoft:#E1F1EF; --green:#22B26B;
  --sh:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(30,25,20,.08);
  --sh2:0 2px 6px rgba(0,0,0,.06),0 22px 50px rgba(30,25,20,.18);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
.ic{width:20px;height:20px;flex:none}
.st{width:15px;height:15px;fill:currentColor;flex:none}
.stars{display:inline-flex;gap:1px;align-items:center}
.shell{max-width:1240px;margin:14px auto;background:var(--surface);border-radius:34px;padding:14px 22px 26px;min-height:calc(100vh - 28px);min-height:calc(100dvh - 28px);box-shadow:var(--sh)}

/* ── Kopfzeile ── */
.top{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 4px;margin-bottom:10px}
.top.hide{display:none}
.team{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap;max-width:280px;overflow:hidden}
.logo{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;background:var(--accent)}
.team span{overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;margin:0 auto;background:rgba(255,255,255,.6);padding:4px;border-radius:999px}
.step{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 9px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.step .mk{min-width:26px;height:26px;border-radius:999px;display:grid;place-items:center;padding:0 6px;background:#E7E4DF;color:var(--ink2)}
.step .mk .st{width:12px;height:12px}
.step .mk .ic{width:14px;height:14px}
.step.cur{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.step.cur .mk{background:var(--ink);color:var(--accent)}
.step.done .mk{background:var(--green);color:#fff}
.step.lock{opacity:.55}
.timer{height:42px;border-radius:999px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card);box-shadow:var(--sh);font-size:16px;white-space:nowrap}
.wbtn{height:42px;border-radius:999px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;background:var(--card);color:var(--ink);box-shadow:var(--sh);white-space:nowrap;flex:none}
.wbtn .ic{width:18px;height:18px}
.timer.warn{background:var(--accent);color:var(--accent-ink)}
.timer.crit{background:var(--M);color:#fff}

/* ── Knöpfe ── */
.btn{min-height:50px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:600;white-space:nowrap;transition:transform .15s,background .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn.big{min-height:60px;padding:0 30px;font-size:18px}
.btn.dark{background:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.round{width:50px;padding:0}
.btn.appear{animation:popIn .5s cubic-bezier(.2,.9,.3,1.25) both}
.btn[disabled]{opacity:.35;pointer-events:none}
.linkbtn{font-size:15px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:12px}

/* ── Start ── */
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:380px;background:#BFD6EA center 30%/cover no-repeat;display:flex;align-items:center;justify-content:flex-end;padding:52px 56px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(246,242,236,.96) 0%,rgba(246,242,236,.88) 42%,rgba(246,242,236,0) 72%)}
.hero-in{position:relative;max-width:540px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:16px}
.eyebrow b{width:8px;height:8px;border-radius:50%;background:var(--M);box-shadow:0 0 0 4px rgba(229,72,77,.18)}
.hero h1{font-size:50px;line-height:1.05;letter-spacing:-.03em;margin:0 0 14px;font-weight:800}
.hero p{font-size:18px;line-height:1.5;color:var(--ink2);margin:0}
.mini-actor{width:128px;aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:var(--sh2);position:relative;background:#ddd;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.mini-actor img{width:100%;height:100%;object-fit:cover;display:block}
.mini-actor span{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;color:var(--ink);border-radius:999px;font-size:12px;font-weight:600;text-align:center;padding:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.startrow{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.lvlist{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lvmini{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/1.05;background:#ddd;box-shadow:var(--sh)}
.lvmini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lvmini>span{display:block;position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:16px;font-size:13px;font-weight:600;padding:6px 8px;text-align:center;line-height:1.25}
.lvmini>span>.stars{display:flex;justify-content:center;color:#E0A800;margin-bottom:2px}
.lvmini.bonus::after{content:"Bonus";position:absolute;top:8px;right:8px;background:var(--ink);color:var(--accent);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.rules{margin-top:12px;font-size:15px;color:var(--ink2);font-weight:600;text-align:center}
.go-card{background:var(--card);border-radius:26px;padding:22px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.go-card h3{margin:0 0 2px;font-size:20px;line-height:1.3}
.namerow{display:flex;align-items:center;gap:12px}
.namerow img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:3px solid #fff;box-shadow:0 0 0 2.5px var(--c);flex:none}
.namerow.M{--c:var(--M)} .namerow.R{--c:var(--R)}
.namerow label{display:block;font-size:13px;font-weight:700;color:var(--c);margin:0 0 4px 16px}
.namerow div{flex:1}
.tin{width:100%;height:52px;border-radius:999px;border:1.5px solid var(--line);padding:0 20px;font-size:18px;outline:none;background:var(--surface)}
.tin:focus{border-color:var(--ink);background:#fff}

/* ── Erklärseite ── */
.brief{display:grid;grid-template-columns:.9fr 1.1fr;gap:0;background:var(--card);border-radius:30px;box-shadow:var(--sh);overflow:hidden;max-width:1000px;margin:10px auto 0;animation:rise .5s both}
.brief .pic{min-height:420px;background:#ddd center/cover no-repeat;position:relative}
.brief .pic .lbadge{position:absolute;left:20px;top:20px}
.brief .txt{padding:40px 40px 34px;display:flex;flex-direction:column;gap:18px}
.brief .kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brief h2{margin:-8px 0 0;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.brief ol{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.brief li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:18px;line-height:1.45}
.brief li b.n{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px}
.backnote{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 16px;font-size:16px;font-weight:500;color:var(--ink2)}
.backnote .ic{color:var(--ink)}
.goal{display:flex;gap:12px;align-items:center;background:#FFF6D6;color:#5A4100;border-radius:18px;padding:12px 16px;font-size:16px;font-weight:500;line-height:1.4}
.goal b{font-weight:700}
.goal .ic{flex:none}
.brief .go{margin-top:auto;align-self:flex-start}

/* ── Level-Kopf ── */
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.lt{display:flex;align-items:center;gap:12px;flex:1;min-width:260px}
.lbadge{height:46px;padding:0 12px;border-radius:16px;background:var(--ink);color:var(--accent);display:inline-flex;align-items:center;flex:none}
.lbadge .st{width:18px;height:18px}
.lt b{display:block;font-size:21px;letter-spacing:-.01em}
.lt small{display:block;color:var(--ink2);font-size:15px;margin-top:2px}
.lacts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.dot.M{background:var(--M)} .dot.R{background:var(--R)}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;box-shadow:0 0 0 2px var(--c);background:#ddd;flex:none;vertical-align:middle}
.av.M{--c:var(--M)} .av.R{--c:var(--R)}
.av.sm{width:26px;height:26px}
.av.xs{width:22px;height:22px;margin-right:7px;box-shadow:0 0 0 1.5px var(--c)}

/* ── Level 1: Schritt für Schritt ── */
.pgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:stretch;min-height:0}
.stage{position:relative;border-radius:30px;overflow:hidden;min-height:0;background:#3A2A1C center/cover no-repeat;display:flex;flex-direction:column}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,8,.15),rgba(20,14,8,.05) 40%,rgba(20,14,8,.35));pointer-events:none}
.prog{position:absolute;top:16px;left:20px;right:20px;display:flex;gap:5px;z-index:2}
.prog i{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.45);transition:background .3s}
.prog i.d{background:#fff}
.prog i.c{background:var(--accent)}
.bubble-area{position:relative;flex:1 1 0;min-height:0;overflow:hidden;display:flex;align-items:center;padding:46px 26px 8px;z-index:1}
.cast,.controls{flex:none}
.bubble{position:relative;background:#fff;border-radius:28px;padding:20px 26px 22px;max-width:88%;box-shadow:var(--sh2);font-size:var(--bfs,26px);line-height:1.5;font-weight:500}
.bubble.M{margin-right:auto;transform-origin:15% 110%;animation:popIn .45s cubic-bezier(.2,.9,.3,1.25) both}
.bubble.R{margin-left:auto;transform-origin:85% 110%;animation:popIn .45s cubic-bezier(.2,.9,.3,1.25) both}
.bubble::after{content:"";position:absolute;bottom:-12px;width:28px;height:28px;background:#fff;transform:rotate(45deg);border-radius:5px}
.bubble.M::after{left:64px} .bubble.R::after{right:64px}
.bwho{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px;line-height:1.2}
.bwho small{font-weight:500;color:var(--muted);font-size:14px}
.gl{border-bottom:2.5px dotted #B8B4AE;cursor:pointer}
.cast{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 26px 0;position:relative;z-index:1}
.actor{width:var(--aw,150px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:4px solid #fff;background:#ddd;position:relative;margin:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),filter .4s,box-shadow .4s,opacity .4s;filter:saturate(.5) brightness(.85);opacity:.85}
.actor img{width:100%;height:100%;object-fit:cover;display:block}
.actor figcaption{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:14px;font-size:13px;font-weight:700;text-align:center;padding:4px;line-height:1.2}
.actor figcaption small{display:block;font-weight:500;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actor.speaking{transform:translateY(-8px) scale(1.07);filter:none;opacity:1}
.actor.M.speaking{box-shadow:0 0 0 4px var(--M),0 18px 40px rgba(229,72,77,.4)}
.actor.R.speaking{box-shadow:0 0 0 4px var(--R),0 18px 40px rgba(31,122,122,.4)}
.controls{position:relative;z-index:2;display:flex;gap:10px;justify-content:center;margin:16px auto 18px;padding:8px;border-radius:999px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.script{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:16px 14px 12px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.script-head{padding:0 4px 10px 0;font-size:16px;font-weight:700}
.script ol{list-style:none;margin:0;padding:0;overflow:hidden;flex:1;min-height:0;display:grid;gap:2px;align-content:start}
.sl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:calc(var(--sfs,15px)*.28) 10px;border-radius:16px;cursor:pointer;transition:background .25s,opacity .25s}
.sl b{font-size:12px;color:var(--muted);font-weight:600}
.sl p{margin:0;font-size:var(--sfs,15px);line-height:1.45}
.sl .av{width:calc(var(--sfs,15px)*1.55);height:calc(var(--sfs,15px)*1.55)}
.sl.cur.M{background:var(--Msoft);box-shadow:inset 3px 0 0 var(--M)}
.sl.cur.R{background:var(--Rsoft);box-shadow:inset 3px 0 0 var(--R)}
.sl.past{opacity:.6}

/* ── ganzer Dialog auf Rezeptionshintergrund (Level 1 gesamt, 2, 3) ── */
.dstage{border-radius:30px;background:#3A2A1C center/cover no-repeat;padding:14px;position:relative}
.dbox{background:rgba(255,255,255,.97);border-radius:26px;box-shadow:var(--sh2);padding:6px 28px;margin:0 auto;animation:rise .45s both}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;min-height:52px;border-bottom:1px solid var(--line)}
.dhead b{font-size:17px}
.dl{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:calc(var(--fs,21px)*.36) 0;border-bottom:1px solid #EEECE8;align-items:baseline}
.dl:last-child{border-bottom:0}
.who{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden}
.who em{font-style:normal;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.dl .who .av{width:26px;height:26px}
.dl .tx{font-size:var(--fs,21px);line-height:1.45;font-weight:500}
.blk{display:inline-block;min-width:calc(var(--len)*.5em + 16px);height:1.25em;vertical-align:-.28em;border-radius:7px;background:#F1EBDD;box-shadow:inset 0 -2px 0 #BFB49D;margin:0 2px}

/* ── Level 4: Verlaufsplan ── */
.l4grid{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.plan{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:16px}
.plan-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 10px 8px}
.plan ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.plan li{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:16px;font-size:16px;font-weight:600;color:var(--ink2);cursor:pointer;min-height:50px;transition:background .2s}
.plan li b{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:14px;flex:none}
.plan li b .ic{width:16px;height:16px}
.plan li.ok b{background:var(--green);color:#fff}
.plan li.cur{background:var(--ink);color:#fff}
.plan li.cur b{background:var(--accent);color:var(--accent-ink)}
.stepcard{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:24px 28px}
.sc-head{display:flex;align-items:center;gap:12px}
.sc-head h3{margin:0;font-size:26px;letter-spacing:-.02em}
.sc-num{font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border-radius:999px;padding:5px 11px;white-space:nowrap}
.idea-box{display:flex;gap:10px;align-items:center;background:#FFF6D6;color:#5A4100;border-radius:16px;padding:12px 16px;font-size:16px;font-weight:600;margin:16px 0 4px;width:100%;text-align:left;min-height:52px}
.idea-box .ic{flex:none}
.idea-box.acts .ic:last-child{margin-left:auto}
.slots{display:grid;gap:18px;margin-top:18px}
.slot{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.slot.M{--c:var(--M);--s:var(--Msoft)} .slot.R{--c:var(--R);--s:var(--Rsoft)}
.slot .av{width:52px;height:52px;box-shadow:0 0 0 2.5px var(--c)}
.slot-who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--c);margin:2px 0 6px;min-height:20px}
.slot-who em{font-style:normal;font-weight:500;color:var(--muted)}
.slot-de{font-size:15px;color:var(--ink2);margin:0 0 6px;font-style:italic}
.slot textarea{width:100%;resize:none;border:2px solid transparent;background:var(--s);border-radius:18px;padding:13px 16px;font-size:19px;line-height:1.45;outline:none;min-height:56px;overflow:hidden;transition:border-color .2s,background .2s}
.slot textarea:focus{border-color:var(--c);background:#fff}
.slot textarea::placeholder{color:#9B958D}
.sc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

/* Aktivitäten-Fenster */
.sheet.wide{max-width:1000px;text-align:left;padding:22px 24px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.shead h2{margin:0;font-size:24px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.acard{background:var(--surface);border-radius:20px;padding:14px 16px}
.acard h4{margin:0 0 8px;font-size:17px}
.ar{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:14px;padding:3px 0;line-height:1.35}
.ar span{color:var(--muted);font-weight:600}
.ar b{font-weight:500}
.athumb{display:block;width:100%;height:110px;border-radius:14px;background:#ddd center 20%/cover;margin-bottom:10px;position:relative}
.athumb span{position:absolute;left:8px;bottom:8px;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.athumb .ic{width:16px;height:16px}
/* Word Bank */
.sheet.bank{max-width:720px;text-align:left;padding:22px 24px}
.wgrid{display:grid;gap:12px}
.wcard{background:var(--surface);border-radius:20px;padding:16px 20px;border:2.5px solid transparent;transition:border-color .3s,background .3s}
.wcard.sel{background:#FFF8E1;border-color:var(--accent)}
.wcard .w-en{font-size:26px;font-weight:700;letter-spacing:-.01em}
.wcard .w-de{font-size:19px;color:var(--ink2);margin-top:2px}
.wcard .w-ex{font-size:16px;color:var(--ink2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);line-height:1.45}
.wcard .w-ex b{color:var(--ink)}
.flyerimg{display:block;max-width:100%;max-height:78vh;margin:0 auto;border-radius:12px;box-shadow:var(--sh)}

/* ── Präsentation ── */
.badge-ic{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto}
.badge-ic .ic{width:36px;height:36px}
.ask{background:var(--card);border-radius:30px;box-shadow:var(--sh);padding:40px 30px;text-align:center;max-width:720px;margin:24px auto}
.ask h2{margin:16px 0 8px;font-size:32px;letter-spacing:-.02em}
.ask p{margin:0 auto 26px;color:var(--ink2);font-size:17px}
.ask .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ask .row .btn{min-width:150px}
.ask .pair{display:flex;gap:18px;justify-content:center;margin-bottom:6px}
.pres-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pres-head h2{margin:0;font-size:24px;letter-spacing:-.01em;flex:1;min-width:220px;display:flex;align-items:center;gap:10px}
.helps{display:flex;gap:4px;background:rgba(255,255,255,.7);padding:4px;border-radius:999px}
.helps button{min-height:42px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.helps button .st{width:12px;height:12px}
.helps button.on{background:var(--ink);color:#fff}
.helps button.on .st{color:var(--accent)}
.notebar{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;margin:0 auto 14px;width:fit-content;max-width:100%;text-align:center}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}

/* ── Overlay & Effekte ── */
.ovl{position:fixed;inset:0;background:rgba(24,22,20,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.ovl.open{display:flex}
.sheet{background:#fff;border-radius:30px;max-width:540px;width:100%;padding:30px 30px 26px;box-shadow:var(--sh2);max-height:92vh;overflow:auto;animation:popIn .4s cubic-bezier(.2,.9,.3,1.2) both;text-align:center}
.sheet h2{margin:16px 0 8px;font-size:26px;letter-spacing:-.02em}
.sheet p{margin:0 auto 6px;color:var(--ink2);line-height:1.5;max-width:420px}
.sh-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.center{max-width:760px;margin:30px auto 0;text-align:center}
.center h2{font-size:34px;letter-spacing:-.02em;margin:16px 0 8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:90;box-shadow:var(--sh2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:95;display:none}
.dev{position:fixed;left:10px;bottom:10px;z-index:99;background:#7C3AED;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.dev select{font-size:12px;border-radius:8px;border:0;padding:2px 4px}

@keyframes popIn{from{opacity:0;transform:scale(.86) translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* iPad hochkant / schmal */
@media (max-width:1020px){
  .pgrid,.sgrid,.startrow{grid-template-columns:1fr}
  .pgrid{grid-template-rows:52fr 48fr}
  .actor{width:118px}
  .l4grid{grid-template-columns:1fr}
  .plan{padding:8px}
  .plan-h{display:none}
  .plan ol{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .plan li{flex:none;padding:6px 10px}
  .plan li:not(.cur) span{display:none}
  .hero h1{font-size:42px}
  .step>span:last-child{display:none}
  .step{padding:7px}
  .wbtn{padding:0 14px}
  .brief{grid-template-columns:1fr}
  .brief .pic{min-height:240px}
  .dstage{padding:14px}
  .dl{grid-template-columns:170px 1fr}
}
@media (max-width:820px){
  .hero{padding:36px 30px;min-height:300px}
  .hero::before{background:linear-gradient(180deg,rgba(246,242,236,.96) 0%,rgba(246,242,236,.8) 55%,rgba(246,242,236,.2) 100%)}
}
@media (max-width:620px){
  .shell{margin:0;border-radius:0;padding:10px 14px 20px;min-height:100vh}
  .top{flex-wrap:wrap}
  .steps{order:3;margin:0}
  .wbtn{margin-left:auto;padding:0 12px}
  .wbtn span{display:none}
  .hero h1{font-size:32px}
  .lvlist{grid-template-columns:repeat(2,1fr)}
  .bubble{font-size:20px;max-width:94%;padding:16px 18px}
  .actor{width:100px}
  .dl{grid-template-columns:1fr;gap:6px}
  .dbox{padding:8px 16px 12px}
  .brief .txt{padding:24px}
}
@media (display-mode:standalone){.shell{margin-top:max(14px,env(safe-area-inset-top))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div class="shell">
  <header class="top hide" id="top"></header>
  <main id="view"></main>
</div>
<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   Lern-App Vorstunde EUV 4 (Englisch): „How can we plan a day at a campsite?“
   Dialog „At the campsite“: Max und die Rezeptionistin vom Lake Camp
   Ablauf: Namen pro Rolle → [Erklärung] Level 1 → [Erklärung] Level 2 → [Erklärung] Level 3 → [Erklärung] Level 4 → Präsentation
   · Gesamtzeit TOTAL_SEC (15 Min.); bei Zeitende einmal „2 more minutes?“ (EXTRA_SEC), danach Präsentation
   · Nächstes Level erscheint erst nach MIN_SEC im Level (Zeit wird nicht angezeigt)
   · Ein Level zurück ist jederzeit erlaubt, nicht weiter
   · Level 4 nur, wenn Level 1–3 in höchstens L4_SEC (11 Min.) geschafft
   · Präsentation: Hilfe = nur das zuletzt bearbeitete Level
   · Kein Ton. Bilder: assets/ (siehe assets/LIESMICH.txt) – fehlt ein Bild, nimmt die App ihre eigene Zeichnung
   Testmodus: index.html?dev (kurze Zeiten + Sprungmenü)
   ════════════════════════════════════════════════════════════════ */
const FRAGE = 'How can we plan a day at a campsite?';
const DEV = /[?&]dev\b/.test(location.search);
const DEMO = DEV && (location.search.match(/[?&]demo=(\d)/) || [])[1];   // Vorschau für Screenshots, echte Zeiten
const FAST = DEV && !DEMO;
const TOTAL_SEC = FAST ? 120 : 15*60;   // Gesamtzeit
const EXTRA_SEC = FAST ? 30 : 2*60;     // einmalige Verlängerung, wird nur im „Time is up“-Fenster angeboten
const MIN_SEC = FAST ? 10 : 180;        // Mindest-Übungszeit pro Level (1–3)
const L4_SEC = FAST ? 90 : 11*60;       // Level 1–3 in höchstens dieser Zeit → Level 4 frei

// ───────────── Dialog „At the campsite“ (Lücken für Level 2 in [eckigen Klammern], wie auf dem Arbeitsblatt Level 2) ─────────────
const MODEL = [
  {r:'M', gap:'Excuse me! Can I go [canoeing] today?',
   de:'Entschuldigung! Kann ich heute Kanu fahren?'},
  {r:'R', gap:'Yes, of course! The lake is [open] from nine to six.',
   de:'Ja, natürlich! Der See ist von neun bis sechs Uhr geöffnet.'},
  {r:'M', gap:'Great! How much does it [cost]?',
   de:'Super! Wie viel kostet das?'},
  {r:'R', gap:'It’s seven euros fifty for one [hour]. You get a free [life jacket].',
   de:'Es kostet sieben Euro fünfzig für eine Stunde. Du bekommst eine kostenlose Schwimmweste.'},
  {r:'M', gap:'OK! And what can we do in the [evening]?',
   de:'Okay! Und was können wir am Abend machen?'},
  {r:'R', gap:'There’s a [campfire] at eight o’clock.',
   de:'Um acht Uhr gibt es ein Lagerfeuer.'},
  {r:'M', gap:'Sounds [fun]! See you later!',
   de:'Klingt lustig! Bis später!'},
  {r:'R', gap:'Bye! Have fun on the [lake]!',
   de:'Tschüss! Viel Spaß auf dem See!'},
];

// Die neuen Wörter (Level 1: gepunktet unterstrichen → antippen = Word Bank mit Übersetzung und Beispielsatz)
const GLOSS = [
  {en:'canoeing', de:'Kanu fahren'}, {en:'life jacket', de:'Schwimmweste'}, {en:'campfire', de:'Lagerfeuer'},
];

const ROLES = {M:{name:'Max', img:'max'}, R:{name:'Receptionist', img:'rec'}};
// Level: Titel, Kurzname (Kopfzeile), Kurzanweisung (über dem Level), Erklärseite (Schritte)
const LEVELS = [null,
  {title:'Step by step', short:'Step by step', instr:'Read your lines in your role.',
   steps:['Go through the dialogue step by step.', 'Read your speech bubbles in your role.', 'Then you see the whole dialogue. Practise it together.']},
  {title:'Fill the gaps', short:'Gaps', instr:'Practise the dialogue in your roles. Say the missing words.',
   steps:['Some words are missing.', 'Practise the dialogue on your own in your roles.', 'Say the missing words.']},
  {title:'German → English', short:'German', instr:'Practise the dialogue in English in your roles.',
   steps:['You only see the German dialogue.', 'Practise the dialogue on your own in your roles.', 'Speak English!']},
  {title:'Your own dialogue', short:'Your dialogue', instr:'Write your own dialogue. Follow the plan.',
   steps:['Follow the plan step by step.', 'Write your own sentences in English. The German hints tell you what to say.', 'Then practise your dialogue in your roles.']},
];

// Level 4: Verlaufsplan nach den Ideen vom Arbeitsblatt Level 4 – je Sprechzeile nur eine deutsche Umschreibung (was gesagt wird, nicht wie)
const PLAN = [
  {t:'Ask for an activity',  acts:true, slots:[['M','Sprich die Rezeptionistin an und frag nach einer Aktivität (z. B. Klettern).']]},
  {t:'Opening times',        acts:true, slots:[['R','Sag, wann die Aktivität geöffnet ist.']]},
  {t:'The price',            acts:true, slots:[['M','Frag nach dem Preis.'], ['R','Nenne den Preis.']]},
  {t:'The evening',          acts:true, slots:[['M','Frag, was ihr am Abend machen könnt.'], ['R','Schlag etwas für den Abend vor.']]},
  {t:'Say goodbye',          slots:[['M','Bedanke dich und verabschiede dich.'], ['R','Verabschiede dich und wünsche viel Spaß.']]},
];
// Lake Camp activities (Eckdaten – Beispielwerte, frei änderbar). flyer = gezeichneter Flyer, eigenes Bild: assets/flyer_*.jpg
const ACTIVITIES = [
  {name:'Canoeing', flyer:'flyer_canoe', price:'7.50 euros for one hour', where:'the lake', when:'every day, 9 am – 6 pm', time:'1 hour or more', info:'You get a free life jacket.'},
  {name:'Rock climbing', flyer:'flyer_climbing', price:'10 euros', where:'the climbing wall', when:'every day, 10 am – 4 pm', time:'about 2 hours', info:'You get a free helmet.'},
  {name:'Campfire', flyer:'flyer_campfire', price:'free', where:'next to the lake', when:'every evening, 8 pm', time:'about 2 hours', info:'Bring a jumper.'},
  {name:'Swimming', price:'free', where:'the lake', when:'every day, 9 am – 6 pm', time:'as long as you like', info:'Bring a towel.'},
  {name:'Mountain biking', price:'12 euros a day', where:'the reception', when:'every day, 9 am – 5 pm', time:'about 3 hours', info:'You get a map of the bike tours.'},
  {name:'Barbecue', price:'5 euros', where:'the barbecue area', when:'Friday and Saturday, 7 pm', time:'about 2 hours', info:'Sausages and salad are included.'},
  {name:'Beach volleyball', price:'free', where:'the beach', when:'all day', time:'about 1 hour', info:'Ask for a ball at the reception.'},
  {name:'Night walk', price:'3 euros', where:'the camp gate', when:'Saturday, 9 pm', time:'about 1 hour', info:'Bring a torch.'},
];

// ───────────── Grundgerüst ─────────────
const KEY = 'vs-euv4-campsite-v1';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = g => g.replace(/[\[\]]/g, '');
const norm = s => s.replace(/[’‘]/g, "'");
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2, '0'); };
const ICONS = {
  back:'<path d="M15 18l-6-6 6-6"/>', next:'<path d="M5 12h14M13 6l6 6-6 6"/>', prevlv:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  check:'<path d="M20 6L9 17l-5-5"/>', lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  up:'<path d="M18 15l-6-6-6 6"/>', down:'<path d="M6 9l6 6 6-6"/>', steps:'<path d="M4 6h10M4 12h16M4 18h7"/>',
  clock:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>', flag:'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
  present:'<path d="M3 4h18M5 4v10a2 2 0 002 2h10a2 2 0 002-2V4M12 16v5M8 21h8"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>',
  restart:'<path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.7L3 8"/><path d="M3 3v5h5"/>',
  hide:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4.2M6.6 6.6A17 17 0 002 12s3.5 7 10 7a9.7 9.7 0 005.4-1.6"/>',
  show:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
};
const icon = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const STAR = '<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.85 6 6.55.75-4.85 4.5 1.3 6.5L12 17.1l-5.85 3.25 1.3-6.5L2.6 9.35l6.55-.75z"/></svg>';
const stars = n => `<span class="stars" aria-label="Level ${n}">${STAR.repeat(n)}</span>`;

// ───────────── Speicher (nur auf diesem iPad) ─────────────
// screen: intro | brief | level | present · lvl: aktuelles Level · max: höchstes erreichtes Level · last: zuletzt bearbeitet
const fresh = () => ({v:5, names:{M:'', R:''}, screen:'intro', lvl:1, max:0, last:1, seen:{}, t0:null, t3:null, l4open:false, over:false, extra:false, helpLv:4,
  start:{1:null, 2:null, 3:null}, l1full:false, l4:null, own:null, help:null});
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||'null'); return s && s.v === 5 ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = fresh();
const nm = r => S.names[r] || '';
const pairName = () => [nm('M'), nm('R')].filter(Boolean).join(' & ');

const ASSETS = {hero:'bg_hero', lobby:'bg_reception', max:'max', rec:'receptionist', flyer_canoe:'flyer_canoe', flyer_climbing:'flyer_climbing', flyer_campfire:'flyer_campfire', l1:'level1', l2:'level2', l3:'level3', l4:'level4', logo:'logo'};
const IMG = {};
const svgURL = (w, h, body) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">${body}</svg>`);
function rng(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const f1 = n => (+n).toFixed(1);
const grad = (id, a, b, vert=true) => `<linearGradient id="${id}" x1="0" y1="0" x2="${vert?0:1}" y2="${vert?1:0}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const glow = (id, c, op=.85) => `<radialGradient id="${id}"><stop offset="0" stop-color="${c}" stop-opacity="${op}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
const FONT = 'Helvetica,Arial,sans-serif';

// ── Bausteine: Kiefer, Baumreihe, Berge, Zelt, Lagerfeuer, Kanu ──
function pine(x, b, h, c){
  const w = h*.46, tier = (top, bot, sc) => `<path d="M${f1(x)} ${f1(top)} L${f1(x+w*sc/2)} ${f1(bot)} L${f1(x-w*sc/2)} ${f1(bot)}Z" fill="${c}"/>`;
  return `<rect x="${f1(x-h*.035)}" y="${f1(b-h*.16)}" width="${f1(h*.07)}" height="${f1(h*.16)}" fill="#5B4232"/>`
    + tier(b-h*.55, b-h*.12, 1) + tier(b-h*.78, b-h*.32, .8) + tier(b-h, b-h*.52, .6);
}
function treeline(r, x0, x1, b, hmin, hmax, c){
  let x = x0, o = '';
  while(x < x1){ o += pine(x, b, hmin + r()*(hmax-hmin), c); x += 14 + r()*26; }
  return o;
}
function hills(pts, b, c){ return `<path d="M${pts[0][0]} ${b} ${pts.map(p => `L${p[0]} ${p[1]}`).join(' ')} L${pts[pts.length-1][0]} ${b}Z" fill="${c}"/>`; }
function tent(x, b, w, c, side){
  const h = w*.62;
  return `<path d="M${f1(x)} ${f1(b-h)} L${f1(x+w*.82)} ${f1(b-h*.94)} L${f1(x+w*1.2)} ${f1(b)} L${f1(x+w/2)} ${f1(b)}Z" fill="${side}"/>
    <path d="M${f1(x-w/2)} ${f1(b)} L${f1(x)} ${f1(b-h)} L${f1(x+w/2)} ${f1(b)}Z" fill="${c}"/>
    <path d="M${f1(x-w*.17)} ${f1(b)} L${f1(x)} ${f1(b-h*.56)} L${f1(x+w*.17)} ${f1(b)}Z" fill="#2E2219" opacity=".55"/>
    <path d="M${f1(x)} ${f1(b-h*.56)} L${f1(x+w*.17)} ${f1(b)} L${f1(x+w*.29)} ${f1(b)}Z" fill="#fff" opacity=".25"/>
    <line x1="${f1(x)}" y1="${f1(b-h)}" x2="${f1(x)}" y2="${f1(b-h-w*.06)}" stroke="#5B4232" stroke-width="${f1(w*.025)}" stroke-linecap="round"/>`;
}
function fire(x, b, s, gid){
  const P = (dx, dy) => `${f1(x+dx*s)} ${f1(b-dy*s)}`;
  return `<circle cx="${f1(x)}" cy="${f1(b-30*s)}" r="${f1(120*s)}" fill="url(#${gid})"/>
    <g fill="#6B4430"><rect x="${f1(x-50*s)}" y="${f1(b-12*s)}" width="${f1(100*s)}" height="${f1(15*s)}" rx="${f1(7*s)}" transform="rotate(15 ${f1(x)} ${f1(b)})"/>
    <rect x="${f1(x-50*s)}" y="${f1(b-12*s)}" width="${f1(100*s)}" height="${f1(15*s)}" rx="${f1(7*s)}" transform="rotate(-15 ${f1(x)} ${f1(b)})"/></g>
    <path d="M${P(0,96)} C${P(34,58)} ${P(40,22)} ${P(0,6)} C${P(-40,22)} ${P(-34,58)} ${P(-10,70)} C${P(-8,82)} ${P(-4,90)} ${P(0,96)}Z" fill="#F2733A"/>
    <path d="M${P(4,62)} C${P(22,40)} ${P(22,18)} ${P(0,8)} C${P(-22,18)} ${P(-20,38)} ${P(4,62)}Z" fill="#FFC93C"/>
    <g fill="#FFC93C"><circle cx="${f1(x+26*s)}" cy="${f1(b-118*s)}" r="${f1(3*s)}"/><circle cx="${f1(x-20*s)}" cy="${f1(b-132*s)}" r="${f1(2.5*s)}"/><circle cx="${f1(x+8*s)}" cy="${f1(b-150*s)}" r="${f1(2*s)}"/></g>`;
}
function canoe(x, y, s, c){
  const P = (dx, dy) => `${f1(x+dx*s)} ${f1(y+dy*s)}`;
  return `<path d="M${P(-104,-10)} Q${P(0,34)} ${P(104,-10)} Q${P(0,6)} ${P(-104,-10)}Z" fill="${c}"/>
    <path d="M${P(-104,-10)} Q${P(0,6)} ${P(104,-10)}" stroke="#7A2E1E" stroke-width="${f1(3*s)}" fill="none"/>
    <line x1="${f1(x+18*s)}" y1="${f1(y-58*s)}" x2="${f1(x+46*s)}" y2="${f1(y+22*s)}" stroke="#8A5A3C" stroke-width="${f1(5*s)}" stroke-linecap="round"/>
    <ellipse cx="${f1(x+48*s)}" cy="${f1(y+26*s)}" rx="${f1(7*s)}" ry="${f1(16*s)}" transform="rotate(-20 ${f1(x+48*s)} ${f1(y+26*s)})" fill="#8A5A3C"/>`;
}
function lake(y0, y1, w, a, b){
  return `<rect y="${y0}" width="${w}" height="${y1-y0}" fill="url(#${a})"/>
    <g stroke="${b}" stroke-width="3" stroke-linecap="round" opacity=".7">${Array.from({length:9}, (_, i) => { const yy = y0 + 18 + i*((y1-y0-30)/9), xx = (i*263) % (w-180); return `<line x1="${xx}" y1="${f1(yy)}" x2="${xx+70+(i%3)*40}" y2="${f1(yy)}"/>`; }).join('')}</g>`;
}
// Landschaft mit See (für Startbild, Fenster und Hintergründe)
function landscape(r, w, horizon, shore, opt={}){
  return `${hills([[0,horizon-120],[w*.14,horizon-210],[w*.3,horizon-110],[w*.46,horizon-240],[w*.62,horizon-130],[w*.8,horizon-220],[w,horizon-100]], horizon, opt.far || '#B7C3D3')}

    ${lake(horizon, shore, w, 'lk', '#BFE0EE')}`;
}

// Eigene Bilder aus assets/ bevorzugen (jpg, png oder webp)
function tryImg(src){ return new Promise(res => { const i = new Image(); const t = setTimeout(() => res(null), 4000); i.onload = () => { clearTimeout(t); res(src); }; i.onerror = () => { clearTimeout(t); res(null); }; i.src = src; }); }
async function resolveAssets(){
  await Promise.all(Object.entries(ASSETS).map(async ([k, base]) => {
    for(const ext of ['jpg','png','webp']){ const ok = await tryImg(`assets/${base}.${ext}`); if(ok){ IMG[k] = ok; return; } }
  }));
}


// ───────────── Ablauf ─────────────
const view = $('#view');
const timeLeft = () => (S.t0 ? TOTAL_SEC + (S.extra ? EXTRA_SEC : 0) - (Date.now() - S.t0) / 1000 : TOTAL_SEC);
const levelSec = n => S.start[n] ? (Date.now() - S.start[n]) / 1000 : 0;
const ready = n => n === 4 || levelSec(n) >= MIN_SEC;
function reset(){ closeSheet(); window.scrollTo(0, 0); }
function goBrief(n){ S.screen = 'brief'; S.lvl = n; save(); reset(); render(); }
function goLevel(n){
  S.screen = 'level'; S.lvl = n; S.last = n; S.max = Math.max(S.max, n); S.seen[n] = true;
  if(n <= 3 && !S.start[n]) S.start[n] = Date.now();
  if(!S.t0) S.t0 = Date.now();
  save(); reset(); render();
}
// vorwärts: beim ersten Mal erst die Erklärseite
const enter = n => S.seen[n] ? goLevel(n) : goBrief(n);
function goScreen(s){ S.screen = s; save(); reset(); render(); }
function render(){
  P = null;
  renderTop();
  ({intro:rIntro, brief:rBrief, level:() => S.lvl === 4 ? rStudio() : rLevel(), present:rPresent}[S.screen])();
}
function renderTop(){
  const t = $('#top'), s = S.screen;
  t.classList.toggle('hide', s === 'intro');
  if(s === 'intro') return;
  const pos = s === 'present' ? 5 : S.lvl;
  const l4lock = S.t3 ? !S.l4open : S.t0 && (Date.now() - S.t0) / 1000 > L4_SEC;
  const st = [1, 2, 3, 4, 5].map(k => {
    const done = k !== pos && k <= S.max && (k < pos || s === 'present');
    const lock = k === 4 && l4lock && S.max < 4;
    const cls = k === pos ? 'cur' : done ? 'done' : lock ? 'lock' : '';
    const mk = done ? icon('check') : lock ? icon('lock') : k === 5 ? icon('present') : stars(k);
    return `<div class="step ${cls}"><span class="mk">${mk}</span><span>${k === 5 ? 'Present' : LEVELS[k].short}</span></div>`;
  }).join('');
  t.innerHTML = `<div class="team"><img class="logo" src="${IMG.logo}" alt=""><span>${esc(pairName())}</span></div><div class="steps">${st}</div><button class="wbtn" data-act="bank" aria-label="Word Bank">${icon('book')}<span>Word Bank</span></button>${s !== 'present' ? '<div class="timer" id="timer"></div>' : ''}`;
  tick();
}
function tick(){
  const el = $('#timer');
  if(el){
    const left = timeLeft();
    el.className = 'timer' + (S.t0 && left <= 60 ? ' crit' : S.t0 && left <= 180 ? ' warn' : '');
    el.innerHTML = `${icon('clock')} ${fmt(left)}`;
  }
  // Knopf „nächstes Level“ erscheint erst nach der Mindestzeit (ohne Countdown)
  if(S.screen === 'level' && S.lvl <= 3 && S.lvl === S.max && ready(S.lvl)){
    const nb = $('#nextLv');
    if(!nb) paintActs(true); else if(!nb.textContent.trim().startsWith(nextLabel(S.lvl))) paintActs(false);
  }
  // Level 4 sperrt sich nach L4_SEC → Kopfzeile auffrischen
  const lockNow = S.screen !== 'intro' && !S.t3 && !!S.t0 && (Date.now() - S.t0) / 1000 > L4_SEC;
  if(lockNow !== tick.lock){ tick.lock = lockNow; if(S.screen !== 'intro') renderTop(); }
  if(S.t0 && !S.over && timeLeft() <= 0 && S.screen !== 'present' && S.screen !== 'intro') timeUp();
}
setInterval(tick, 1000);
function timeUp(){
  S.over = true;
  if(S.lvl === 4) S.own = compileOwn();
  save();
  sheet(`<div class="badge-ic">${icon('clock')}</div><h2>Time is up!</h2><p>${S.extra ? 'Now act out the dialogue with your partner.' : 'Do you need two more minutes?'}</p>
    <div class="sh-btns">${S.extra ? '' : `<button class="btn light big" data-act="extra">Yes, 2 more minutes</button>`}<button class="btn dark big" data-act="gopresent">${S.extra ? '' : 'No, '}Present ${icon('next')}</button></div>`);
}

let P = null;
const modelLines = () => MODEL.map(m => ({r:m.r, en:plain(m.gap), gap:m.gap, de:m.de}));
const av = (r, cls='') => `<img class="av ${r} ${cls}" src="${IMG[ROLES[r].img]}" alt="">`;
const whoHTML = r => `<span class="who">${av(r)}<span>${ROLES[r].name}</span>${nm(r) ? `<em>${esc(nm(r))}</em>` : ''}</span>`;
function glossHTML(t){
  const low = norm(t).toLowerCase(), res = [];
  GLOSS.forEach((g, i) => {
    const k = norm(g.en).toLowerCase();
    let idx = low.indexOf(k);
    while(idx >= 0){
      const ok = (idx === 0 || /[^a-z]/.test(low[idx-1])) && (idx+k.length >= low.length || /[^a-z]/.test(low[idx+k.length]));
      if(ok && !res.some(r => idx < r.e && idx+k.length > r.s)) res.push({s:idx, e:idx+k.length, i});
      idx = low.indexOf(k, idx+1);
    }
  });
  res.sort((a, b) => a.s - b.s);
  let out = '', pos = 0;
  res.forEach(r => { out += esc(t.slice(pos, r.s)) + `<span class="gl" data-g="${r.i}">${esc(t.slice(r.s, r.e))}</span>`; pos = r.e; });
  return out + esc(t.slice(pos));
}
const gapBlocks = gap => gap.split(/(\[[^\]]+\])/).filter(Boolean).map(p => p[0] === '[' ? `<span class="blk" style="--len:${p.length - 2}"></span>` : esc(p)).join('');
function lineText(l, n){ return n === 1 ? glossHTML(l.en) : n === 2 ? gapBlocks(l.gap) : n === 3 ? esc(l.de) : esc(l.t); }

function dboxHTML(lines, n){

    ${lines.map(l => `<div class="dl">${whoHTML(l.r)}<div class="tx">${lineText(l, n)}</div></div>`).join('')}</div></div>`;
}

// ───────────── Alles auf einen Bildschirm einpassen (Schrift wird bei Bedarf kleiner) ─────────────
function fitScreen(){
  const avail = window.innerHeight - 42;   // unterer Rand der Seite

    const box = $('.dbox'), top = ds.getBoundingClientRect().top + window.scrollY;
    let fs = 22; box.style.setProperty('--fs', fs + 'px');
    while(fs > 12 && top + ds.offsetHeight > avail){ fs -= .5; box.style.setProperty('--fs', fs + 'px'); }
  }
  const pg = $('.pgrid');
  if(pg){
    const top = pg.getBoundingClientRect().top + window.scrollY;
    pg.style.height = Math.max(440, avail - top) + 'px';
    const ol = $('#script');
    let fs = 17; ol.style.setProperty('--sfs', fs + 'px');

// ───────────── Overlays & Effekte ─────────────
function sheet(html, cls){ const sh = $('#sheet'); sh.className = 'sheet' + (cls ? ' ' + cls : ''); sh.innerHTML = html; sh.scrollTop = 0; $('#ovl').classList.add('open'); }
function closeSheet(){ $('#ovl').classList.remove('open'); }
function toast(t, ms=2600){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('show'), ms); }
// Word Bank: alle neuen Wörter mit Übersetzung und Beispielsatz aus dem Dialog; sel = angetipptes Wort hervorheben
function bankExample(g){
  const k = norm(g.en).toLowerCase(), re = new RegExp(`(^|[^a-z])(${k})(?=[^a-z]|$)`, 'i');
  const line = MODEL.map(m => plain(m.gap)).find(t => re.test(norm(t)));
  if(!line) return '';
  const m = norm(line).match(re), s = m.index + m[1].length;
  return esc(line.slice(0, s)) + `<b>${esc(line.slice(s, s + k.length))}</b>` + esc(line.slice(s + k.length));
}
function showBank(sel){
  sheet(`<div class="shead"><h2>Word Bank</h2><button class="ib" data-act="close" aria-label="Close">${icon('close')}</button></div>
    <div class="wgrid">${GLOSS.map((g, i) => `<div class="wcard ${i === sel ? 'sel' : ''}" id="w${i}">
      <div class="w-en">${esc(g.en)}</div><div class="w-de">${esc(g.de)}</div>
      ${bankExample(g) ? `<div class="w-ex">${bankExample(g)}</div>` : ''}</div>`).join('')}</div>`, 'bank');
  if(sel != null) $('#w' + sel).scrollIntoView({block:'nearest'});
}
function confetti(amount=1){
  const c = $('#confetti'), x = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  c.style.display = 'block';
  const cols = ['#FFC93C','#E5484D','#1F7A7A','#22B26B','#1B1B1E','#F6B935','#fff'];
  const ps = Array.from({length: Math.round(150*amount)}, () => ({x:W/2 + (Math.random()-.5)*W*.35, y:H*.6, vx:(Math.random()-.5)*24*dpr, vy:(-Math.random()*24-12)*dpr,
    s:(7+Math.random()*8)*dpr, r:Math.random()*6, vr:(Math.random()-.5)*.35, c:cols[Math.random()*cols.length|0]}));
  let t0 = performance.now();
  (function f(t){
    const dt = Math.min(32, Math.max(0, t - t0)) / 16; t0 = t;
    x.clearRect(0, 0, W, H); let alive = 0;
    ps.forEach(p => { p.vy += .65*dpr*dt; p.vx *= .985; p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt;
      if(p.y < H + 40){ alive++; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); } });
    if(alive) requestAnimationFrame(f); else { x.clearRect(0, 0, W, H); c.style.display = 'none'; }
  })(t0);
}

// ───────────── Aktionen ─────────────
function act(a, b){
  const d = b.dataset;
  switch(a){
    case 'start':
      S.names = {M:$('#nameM').value.trim().slice(0, 18), R:$('#nameR').value.trim().slice(0, 18)};
      if(S.names.M.length < 2 || S.names.R.length < 2) return;
      goBrief(1); break;
    case 'resume': render(); if(S.over && S.screen !== 'present') timeUp(); break;
    case 'restart':
      sheet(`<div class="badge-ic">${icon('restart')}</div><h2>Are you sure?</h2><p>If you start again, all your progress on this iPad will be deleted.</p>
        <div class="sh-btns"><button class="btn dark" data-act="restartyes">Yes, start again</button><button class="btn light" data-act="close">No</button></div>`); break;
    case 'restartyes': S = fresh(); save(); goScreen('intro'); break;
    case 'close': closeSheet(); break;
    case 'extra': S.extra = true; S.over = false; save(); closeSheet(); tick(); break;
    case 'golevel': goLevel(S.lvl); break;
    // Level 1 Schritt für Schritt
    case 'next':
      if(P.pos < P.lines.length - 1){ P.pos++; paintLine(); }
      else { S.l1full = true; save(); rLevel(); window.scrollTo(0, 0); confetti(.5); }
      break;
    case 'prev': if(P.pos > 0){ P.pos--; paintLine(); } break;
    case 'jump': P.pos = +d.k; paintLine(); break;
    case 'steps': S.l1full = false; save(); rLevel(); break;
    // Level wechseln
    case 'nextlv': closeSheet(); nextLevel(); break;
    case 'backlv': goLevel(S.lvl - 1); break;
    case 'fwdlv': goLevel(S.lvl + 1); break;
    case 'gopresent': if(S.lvl === 4) S.own = compileOwn(); S.help = null; goScreen('present'); break;
    // Level 4
    case 'fin4':
      S.own = compileOwn(); save();
      if(S.own.length < 2){ toast('Write your dialogue first.'); break; }
      confirmPresent(); break;
    case 'l4step': S.l4.step = +d.i; save(); paintPlan(); paintStep(); window.scrollTo(0, 0); break;
    case 'acts': showActs(); break;
    case 'flyer': showFlyer(+d.i); break;
    case 'bank': showBank(); break;
    // Präsentation
    case 'help': S.help = +d.h; save(); rPresent(); window.scrollTo(0, 0); break;
    case 'helplv': S.helpLv = +d.n; save(); rPresent(); break;
  }
}

document.addEventListener('click', e => {
  const gl = e.target.closest('.gl');
  if(gl){ showBank(+gl.dataset.g); return; }
  const b = e.target.closest('[data-act]');
  if(!b) return;
  e.preventDefault();
  act(b.dataset.act, b);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('#nameM')) $('#nameR').focus();
  else if(e.key === 'Enter' && e.target.matches('#nameR')){ const b = $('#startBtn'); if(b && !b.disabled) act('start', b); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('#nameM, #nameR')){ S.names[t.dataset.r] = t.value; $('#startBtn').disabled = $('#nameM').value.trim().length < 2 || $('#nameR').value.trim().length < 2; }
  else if(t.matches('#stepcard textarea')){
    const k = +t.dataset.k, was = stepDone(S.l4.step); S.l4.lines[S.l4.step][k].t = t.value; autosize(t); l4changed();
    if(was !== stepDone(S.l4.step)) paintPlan();
  }
});

// ───────────── Start ─────────────
(async function init(){
  buildPlaceholders();
  const saved = load();
  const demo = DEMO;
  if(demo){   // Vorschau für Screenshots: ?dev&demo=4&step=3 (&acts = Aktivitäten-Fenster offen)
    S = fresh(); S.names = {M:'Anna', R:'Ben'}; S.t0 = Date.now() - 570e3; S.t3 = S.t0 + 560e3; S.l4open = true; S.max = +demo;
    [1,2,3,4].forEach(n => S.seen[n] = true); [1,2,3].forEach(n => S.start[n] = Date.now() - 4e5);
    const st = +((location.search.match(/[?&]step=(\d)/) || [])[1] || 1) - 1; S.l4 = newL4(); S.l4.step = st;
    if(st > 0) S.l4.lines[0] = [{r:'M', t:'Hello! Can I go rock climbing today?'}];
    goLevel(+demo);
    if(/[?&]acts\b/.test(location.search)) showActs();
  }
  else if(saved && saved.screen !== 'intro'){ S = saved; rResume(); }
  else render();
  if(DEV && !demo){
    const dv = document.createElement('div'); dv.className = 'dev';
    dv.innerHTML = 'DEV <select id="devsel"><option>jump …</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4 (open)</option><option value="p">Present</option></select>';
    document.body.appendChild(dv);
    $('#devsel').onchange = e => {
      const v = e.target.value; if(!S.names.M) S.names = {M:'Anna', R:'Ben'}; if(!S.t0) S.t0 = Date.now();
      if(v === 'p'){ S.max = Math.max(S.max, 3); S.help = null; goScreen('present'); }
      else { const n = +v; if(n === 4){ S.t3 = Date.now(); S.l4open = true; } S.max = Math.max(S.max, n - 1); enter(n); }
      e.target.selectedIndex = 0;
    };
  }
  const before = JSON.stringify(IMG);
  await resolveAssets();
  if(JSON.stringify(IMG) !== before && !$('[data-act="resume"]')) render();
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
